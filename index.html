<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Lì Xì May Mắn</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <canvas id="fireworks"></canvas>

    <div class="container">
        <h1 class="title">🎉 Lì Xì May Mắn Năm Mới 🎉</h1>

        <img src="red-lion.png" alt="Lân đỏ" class="lion">

        <p class="subtitle">Chọn một bao lì xì để xem vận may hôm nay!</p>

        <div id="envelope-container" class="envelope-container">
            <!-- Bao lì xì sẽ được tạo tự động -->
        </div>

        <div class="buttons">
            <button id="play-again">Chơi Lại</button>
            <button id="play-music">Phát Nhạc</button>
        </div>
    </div>

    <audio id="bg-music" src="music.mp3" loop></audio>
    <audio id="open-sound" src="open.mp3"></audio>

    <script src="fireworks.js"></script>
    <script src="script.js"></script>
</body>
</html>
