<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Red Envelopes - New Year Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1 class="title">Lucky Red Envelopes - New Year Game</h1>

        <!-- Red Lion Image -->
        <img src="red-lion.png" alt="Red Lion" class="lion">

        <p class="subtitle">Pick a lucky envelope to reveal your prize!</p>

        <div id="envelope-container" class="envelope-container">
            <!-- JS will generate envelopes 1–6 -->
        </div>

        <div class="buttons">
            <button id="play-again">Play Again</button>
            <button id="play-music">Play Music</button>
        </div>
    </div>

    <audio id="bg-music" src="music.mp3" loop></audio>

    <script src="script.js"></script>
</body>
</html>
